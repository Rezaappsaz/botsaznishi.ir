<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش صفر تا صد ساخت ربات روبیکا 🤖</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --copy-color: #10b981;
            --copy-hover: #059669;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --copy-color: #34d399;
            --copy-hover: #10b981;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .theme-toggle {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .theme-toggle:hover {
            background: var(--primary-hover);
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .lesson-info h3 {
            font-size: 1.1rem;
        }

        .lesson-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-copy {
            background: var(--copy-color);
        }

        .btn-copy:hover {
            background: var(--copy-hover);
        }

        .btn.disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            pointer-events: none;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>آموزش ساخت ربات روبیکا 🤖</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 تغییر حالت</button>
        </header>

        <div class="lessons-list">
            <!-- جلسه اول -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه اول</h3>
                </div>
                <div class="lesson-actions">
                    <button class="btn btn-copy" onclick="copyLink('https://www.aparat.com/v/nvqz3by', this)">کپی لینک</button>
                    <a href="https://www.aparat.com/v/nvqz3by" target="_blank" class="btn">تماشای ویدیو</a>
                </div>
            </div>

            <!-- جلسه دوم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه دوم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه سوم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه سوم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه چهارم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه چهارم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه پنجم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه پنجم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه ششم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه ششم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه هفتم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه هفتم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه هشتم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه هشتم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>

            <!-- جلسه نهم -->
            <div class="lesson-card">
                <div class="lesson-info">
                    <h3>جلسه نهم</h3>
                </div>
                <div class="lesson-actions">
                    <a href="#" class="btn disabled">🔒 به‌زودی...</a>
                </div>
            </div>
        </div>

        <footer>
            <p>تمامی حقوق محفوظ است | botsaznihi.ir</p>
        </footer>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        function copyLink(url, btnElement) {
            navigator.clipboard.writeText(url).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = 'کپی شد! ✅';
                setTimeout(() => {
                    btnElement.innerText = originalText;
                }, 2000);
            }).catch(err => {
                alert('خطا در کپی کردن لینک');
            });
        }
    </script>
</body>
</html>
